        - ScanResolution
        - MaxLockedTargets
        - SensorStrength
    TheraConnection:
      type: object
      properties:
        hub:
          type: string
          description: 'Hub is the hub the wormhole leaves from: "Thera" or "Turnur".'
        hub_signature:
          type: string
          description: HubSignature is the signature id in the hub system.
        system:
          type: string
          description: System is the exit system (as the SDE spells it for known space).
        system_id:
          type: integer
          description: SystemID is the exit system's solar system ID.
        system_class:
          type: string
          description: 'SystemClass is EvE-Scout''s class of the exit: "hs", "ls", "ns" or a wormhole class such as "c2".'
        security:
          type:
            - number
            - "null"
          description: Security is the exit's true security status; null in wormhole space.
        sec:
          type:
            - string
            - "null"
          description: Sec is the security exactly as the text prints it ("+0.5"); null in wormhole space.
        region:
          type: string
          description: Region is the exit's region name.
        signature:
          type: string
          description: Signature is the signature id in the exit system.
        wormhole_type:
          type: string
          description: WormholeType is the wormhole type code (for example "V898").
        max_ship_size:
          type: string
          description: MaxShipSize is the largest ship class that fits through ("medium", "large", "xlarge", "capital").
        expires_at:
          type: string
          description: ExpiresAt is when the wormhole is expected to collapse (RFC 3339, UTC).
        remaining_hours:
          type: integer
          description: RemainingHours is the whole hours left, rounded down, computed from expires_at when the answer is served.
        jumps:
          type:
            - integer
            - "null"
          description: Jumps is the gate distance from the near origin; null without near.
      required:
        - hub
        - hub_signature
        - system
        - system_id
        - system_class
        - security
        - sec
        - region
        - signature
        - wormhole_type
        - max_ship_size
        - expires_at
        - remaining_hours
        - jumps
    TheraConnections:
      type: object
      properties:
        as_of:
          type: string
          description: AsOf is the time of the EvE-Scout copy the answer is built from (RFC 3339, UTC).
        hub:
          type: string
          description: 'Hub is the hub filter the request used: "thera", "turnur" or "all".'
        origin:
          type: string
          description: Origin is the system the jumps are counted from; empty without near.
        total:
          type: integer
          description: Total is the number of connections that match, before the limit.
        shown:
          type: integer
          description: Shown is the number of connections in Connections.
        left_out:
          type: integer
          description: LeftOut counts the exits that near left out because they have no gate route from the origin.
        connections:
          type: array
          description: 'Connections are the rows: nearest first with near, else Thera before Turnur, then by system name.'
          items:
            $ref: '#/components/schemas/TheraConnection'
      required:
        - as_of
        - hub
        - origin
        - total
        - shown
        - left_out
        - connections
    TheraConnectionsToolResponse:
      type: object
      properties:
        tool:
          type: string
          description: The tool that ran.
        version:
          type: string
          description: The build version of the service.
        result:
          type: object
          properties:
            text:
              type: string
              description: The answer as the chat assistant reads it.
            data:
              description: The typed answer, or null when the tool has none or the call ended in a text-only answer (an unknown id, a parse failure); `text` then says why.
              oneOf:
                - $ref: '#/components/schemas/TheraConnections'
                - type: "null"
          required:
            - text
            - data
        attribution:
          type: array
          description: The upstreams behind the answer; attribution is a condition of several of their licences.
          items:
            $ref: '#/components/schemas/Source'
      required:
        - tool
        - version
        - result
        - attribution
    ToolResponse:
      type: object
      properties:
        tool:
          type: string
          description: The tool that ran.
        version:
          type: string
          description: The build version of the service.
        result:
          type: object
          properties:
            text:
              type: string
              description: The answer as the chat assistant reads it.
            data:
              type: "null"
              description: The typed answer, or null when the tool has none or the call ended in a text-only answer (an unknown id, a parse failure); `text` then says why.
          required:
