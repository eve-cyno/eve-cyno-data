    TrainingAttributes:
      type: object
      properties:
        perception:
          type:
            - integer
            - "null"
          description: Perception, Memory, Willpower, Intelligence and Charisma are the character's attributes (17 to 50); null when BestRemapPerSkill is true.
        memory:
          type:
            - integer
            - "null"
        willpower:
          type:
            - integer
            - "null"
        intelligence:
          type:
            - integer
            - "null"
        charisma:
          type:
            - integer
            - "null"
        best_remap_per_skill:
          type: boolean
          description: 'BestRemapPerSkill is true when no attributes were given: every skill is trained at primary 27 / secondary 21 (its best remap, no implants), which is 37.5 SP per minute.'
      required:
