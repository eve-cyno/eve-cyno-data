        - name
        - published
        - group_id
        - group
        - category_id
        - category
        - meta_group
        - meta_level
        - tech_level
        - market_group_path
        - base_price
        - portion_size
        - volume_m3
        - packaged_volume_m3
        - capacity_m3
        - mass_kg
        - alpha_usable
