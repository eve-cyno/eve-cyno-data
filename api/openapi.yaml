  /tool/get_jumps_between:
    post:
      tags:
        - tools
      summary: Compute the number of jumps and the route between two EVE solar systems.
      description: |-
        Compute the number of jumps and the route between two EVE solar systems. Default route is shortest (any security). Set prefer_high_sec=true to prefer highsec-only paths (longer but safer). Set detail='summary' for one line (jump count, lowest-security hop, highsec/lowsec/nullsec counts and the highsec-only alternative) instead of the hop list. avoid: systems never to route through (up to 20); via: systems to pass through in order (up to 5).

        Sources: EVE Static Data Export (via Fuzzwork). `result.data` is a `Route` object when the call succeeds.

        Access tier: **public**. No key needed.

        Rate limit: 10 requests per minute per client IP without an API key, 60 per minute per API key with one.
      operationId: get_jumps_between
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avoid:
                  type: array
                  description: Systems never to route through (up to 20), e.g. ['Ahbazon']. The origin and destination are never avoided.
                  items:
                    type: string
                  maxItems: 20
                detail:
                  type: string
                  description: '''route'' (default) lists every hop; ''summary'' answers in one line'
                  enum:
                    - route
                    - summary
                from_system:
                  type: string
                  description: Origin solar system name, e.g. 'Jita'
                prefer_high_sec:
                  type: boolean
                  description: If true, route via highsec only (default false)
                to_system:
                  type: string
                  description: Destination solar system name, e.g. 'Amarr'
                via:
                  type: array
                  description: Systems to pass through, in order (up to 5), e.g. ['Dodixie']
                  items:
                    type: string
                  maxItems: 5
              required:
                - from_system
                - to_system
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
