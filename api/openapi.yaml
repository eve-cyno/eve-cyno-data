  /mcp:
    post:
      tags:
        - mcp
      summary: Model Context Protocol endpoint
      description: |-
        Streamable-HTTP MCP server (stateless, JSON responses): the same tools as `/tool/{name}`, for MCP clients such as Claude Desktop or Claude Code. POST one JSON-RPC 2.0 message per request (`initialize`, `tools/list`, `tools/call`, ...); a notification is answered `202` with no body. `GET` and `DELETE` are not supported in stateless mode (405). Point a client at this URL; it is not meant to be called by hand.

        Rate limit: 60 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: mcp
      parameters:
        - $ref: '#/components/parameters/RequestID'
      security:
        - {}
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification (see https://modelcontextprotocol.io/specification).
              properties:
                jsonrpc:
                  const: "2.0"
                id:
                  type:
                    - string
                    - integer
                method:
                  type: string
                  examples:
                    - tools/list
                params:
                  type: object
              required:
                - jsonrpc
                - method
      responses:
        "200":
          description: The JSON-RPC 2.0 response.
          content:
            application/json:
              schema:
                type: object
                description: 'A JSON-RPC 2.0 response: `result` on success, `error` otherwise.'
                properties:
                  jsonrpc:
                    const: "2.0"
                  id:
                    type:
                      - string
                      - integer
                      - "null"
                  result:
                    type: object
                  error:
                    type: object
                required:
                  - jsonrpc
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
  /health:
    get:
      tags:
        - meta
      summary: Liveness probe
      description: Always 200 while the process serves; a degraded dependency shows in the body, never in the status. The flags say which dependencies loaded, so a degraded service (no SDE, no fit corpus) can be told from a healthy one. `corpus` is true only when the fit corpus is configured and its backend answered a probe (cached for 30 seconds, 1 second timeout); `corpus_configured` is true when a corpus is wired at all, reachable or not.
      operationId: health
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
  /openapi.yaml:
    get:
      tags:
        - meta
      summary: This API description (YAML)
      description: |-
        The OpenAPI 3.1 document of this service, generated from its route table and tool registry.

        Rate limit: 60 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: openapiYaml
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "429":
          $ref: '#/components/responses/RateLimited'
  /openapi.json:
    get:
      tags:
        - meta
      summary: This API description (JSON)
      description: |-
        The same OpenAPI 3.1 document as JSON.

        Rate limit: 60 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: openapiJson
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "429":
          $ref: '#/components/responses/RateLimited'
