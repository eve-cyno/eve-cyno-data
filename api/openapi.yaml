          type: string
          description: The build version of the service.
        result:
          type: object
          properties:
            text:
              type: string
              description: The answer as the chat assistant reads it.
            data:
              description: The typed answer, or null when the tool has none or the call ended in a text-only answer (an unknown id, a parse failure); `text` then says why.
