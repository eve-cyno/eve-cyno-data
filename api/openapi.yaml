  responses:
    BadRequest:
      description: 'The request is malformed: invalid JSON, or a missing or invalid parameter or header (`invalid_request`, `janice_key_required`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    Forbidden:
      description: The tool is disabled on this service (`tool_disabled`), or the key may not run keyed tools (`key_not_permitted`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    InternalError:
      description: The operation failed inside the service (`internal_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    NotFound:
      description: No such route or tool (`not_found`, `unknown_tool`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    PayloadTooLarge:
      description: The request body is over the size cap (`payload_too_large`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    RateLimited:
      description: The caller is over the rate limit; retry after the number of seconds in `Retry-After` (`rate_limited`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    Timeout:
      description: The operation ran past its time budget (`timeout`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    Unauthorized:
      description: The tool needs an API key and the request has none (`api_key_required`), or the key it sent is not valid (`invalid_api_key`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    Unavailable:
      description: A dependency this operation needs is not loaded, for example the SDE or the fit corpus (`unavailable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
    UpstreamError:
      description: An upstream dependency failed (`upstream_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: An ID to correlate this request with the service's logs; echoed in the response.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
  headers:
    RequestID:
      description: 'The request''s ID: the caller''s `X-Request-ID` when it is a token of 1-64 characters from `[A-Za-z0-9._-]`, otherwise a generated one. Quote it when reporting a problem.'
      schema:
        type: string
    RetryAfter:
      description: Seconds until the caller's budget has room again.
      schema:
        type: integer
        minimum: 1
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      description: The same API key in the `X-API-Key` header, for clients that cannot set `Authorization`.
      in: header
      name: X-API-Key
    bearerAuth:
      type: http
      description: 'An API key as `Authorization: Bearer <key>`. Keyed tools need one; the other tools ignore it, but a key that is sent and not valid is refused (`401 invalid_api_key`).'
      scheme: bearer
