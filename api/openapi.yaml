  /tool/plan_jump_route:
    post:
      tags:
        - tools
      summary: Plan a jump-drive route like a capital pilot's jump planner, for a jump freighter, Rorqual, Black Ops, carrier…
      description: |-
        Plan a jump-drive route like a capital pilot's jump planner, for a jump freighter, Rorqual, Black Ops, carrier, dreadnought, Lancer, FAX, supercarrier or titan (give the hull name), or 'Jump Bridge' for a chain of Ansiblex jump bridges (5 ly): the fewest jumps from origin to destination through optional waypoints, then the fewest light-years. Every hop ends where a cynosural field can be lit (lowsec or nullsec; never highsec, wormhole space, Pochven or Zarzakh); capitals cannot start in highsec. One line per hop: region, system, security, NPC stations, light-years, the gate jumps between the same two systems and the isotopes burned; then the totals (light-years, fuel and its m³). Skills default to level 5. Titans, Black Ops and the Rorqual can also bridge, and carriers, supercarriers, Black Ops and the Rorqual can conduit jump, over the same hops; that fuel is not counted. Example: {"origin":"Amamake","destination":"1DQ1-A","ship":"Rhea"}. avoid_incursions and live_info read live ESI data and count against the live-data limit; without them the route comes from the SDE alone.

        Sources: EVE Static Data Export (via Fuzzwork); ESI (EVE Swagger Interface). `result.data` is a `JumpRoute` object when the call succeeds.

        Access tier: **public**. No key needed.

        Rate limit: 10 requests per minute per client IP without an API key, 60 per minute per API key with one.

        Calls with `avoid_incursions` or `live_info` read live public data from EVE's ESI through a shared cache that follows ESI's `Expires`; only those calls count against the fair-use limit below. All live-upstream calls share one fair-use limit of 5 calls per minute per caller without an API key and 10 with one (REST and MCP together, counted across every live tool), on top of the route limit. When the shared ESI budget is nearly spent the call is refused with `503 upstream_busy` (MCP: an error result starting `upstream_busy`) and `Retry-After`; retry later.
      operationId: plan_jump_route
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avoid:
                  type: array
                  description: Systems no hop may end in (up to 20), e.g. ['Tegheon']
                  items:
                    type: string
                  maxItems: 20
                avoid_incursions:
                  type: boolean
                  description: Read the active incursions from ESI (live) and never end a hop in an infested system; incursions jam cynosural fields. Costs one live call.
                avoid_regions:
                  type: array
                  description: Regions no hop may end in (up to 10), e.g. ["Khanid"]
                  items:
                    type: string
                  maxItems: 10
                destination:
                  type: string
                  description: Last stop, a solar system name, e.g. '1DQ1-A'
                live_info:
                  type: boolean
                  description: Add each hop system's sovereignty holder and last-hour jumps and kills from ESI (live). Costs one live call.
                origin:
                  type: string
                  description: Start solar system name, e.g. 'Amamake'
                prefer_stations:
                  type: boolean
                  description: If true, among the routes with the fewest jumps prefer hops that end in systems with an NPC station (default false)
                ship:
                  type: string
                  description: Hull name, e.g. 'Rhea', 'Rorqual', 'Avatar', 'Panther', or 'Jump Bridge' for Ansiblex jump bridges
                skills:
                  type: object
                  description: 'Skill levels 0-5 (default 5 each), e.g. {"jump_drive_calibration": 4}. Jump freighters also use jump_freighters.'
                  properties:
                    jump_drive_calibration:
                      type: integer
                      description: Jump Drive Calibration level, +20% range per level
                      default: 5
                      minimum: 0
                      maximum: 5
                    jump_freighters:
                      type: integer
                      description: Jump Freighters level (jump freighters only), -10% fuel per level
                      default: 5
                      minimum: 0
                      maximum: 5
                    jump_fuel_conservation:
                      type: integer
                      description: Jump Fuel Conservation level, -10% fuel per level
                      default: 5
                      minimum: 0
                      maximum: 5
                waypoints:
                  type: array
                  description: Systems the route must stop at, in order (up to 5), e.g. ["Sahda"]
                  items:
                    type: string
                  maxItems: 5
              required:
                - origin
                - destination
                - ship
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JumpRouteToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
