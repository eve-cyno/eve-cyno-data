    JumpRoute:
      type: object
      properties:
        origin:
          type: string
          description: Origin is the start system as the SDE spells it.
        origin_id:
          type: integer
          description: OriginID is the start system's solar system ID.
        destination:
          type: string
          description: Destination is the last stop as the SDE spells it.
        destination_id:
          type: integer
          description: DestinationID is the destination's solar system ID.
        waypoints:
          type: array
          description: Waypoints are the requested waypoints as the SDE spells them, in order.
          items:
            type: string
        ship:
          type: string
          description: Ship is the hull (or "Ansiblex Jump Bridge") as the SDE spells it.
        ship_group:
          type: string
          description: ShipGroup is the SDE group of the hull, e.g. "Jump Freighter" or "Upwell Jump Bridge".
        skills:
          description: Skills are the skill levels the numbers assume; null for the Ansiblex, which no skill affects.
          oneOf:
            - $ref: '#/components/schemas/JumpSkillLevels'
            - type: "null"
        range_ly:
          type: number
          description: RangeLY is the range of one jump in light-years.
        fuel_type:
          type:
            - string
            - "null"
          description: FuelType is the isotope the hull burns; null for the Ansiblex.
        fuel_per_ly:
          type:
            - number
            - "null"
          description: FuelPerLY is the fuel burned per light-year at these skills, before Jump Drive Economizers; null for the Ansiblex.
        jumps:
          type: integer
          description: Jumps is the number of hops (0 when origin and destination are the same system).
        total_ly:
          type: number
          description: TotalLY is the summed hop length in light-years, to 3 decimals.
        total_fuel:
          type:
            - integer
            - "null"
          description: TotalFuel is the summed fuel of the hops, each rounded to a whole unit; null for the Ansiblex.
        fuel_volume_m3:
          type:
            - number
            - "null"
          description: FuelVolumeM3 is the volume of TotalFuel in cubic metres, to 1 decimal; null for the Ansiblex.
        can_bridge:
          type: boolean
          description: CanBridge is true when the hull can open a jump portal for other ships over the same hops.
        can_conduit:
          type: boolean
          description: CanConduit is true when the hull can conduit jump with passengers over the same hops.
        prefer_stations:
          type: boolean
          description: 'PreferStations is the request flag: among the routes with the fewest jumps, fewest hops ending in a system without an NPC station.'
        avoid:
          type: array
          description: Avoid lists the systems no hop ends in, as the SDE spells them, in request order.
          items:
            type: string
        avoid_regions:
          type: array
          description: AvoidRegions lists the regions no hop ends in, as the SDE spells them, in request order.
          items:
            type: string
        avoid_incursions:
          type: boolean
          description: 'AvoidIncursions is the request flag: no hop ends in a system with an active incursion (read live from ESI).'
        incursion_systems:
          type: integer
          description: IncursionSystems lists how many systems ESI reports as infested when avoid_incursions read the incursions; 0 when nothing was read (no flag, or a same-system answer).
        live_info:
          type: boolean
          description: 'LiveInfo is the request flag: each hop carries live sovereignty and activity.'
        live_unavailable:
          type:
            - string
            - "null"
          description: LiveUnavailable is the answer text of the ESI read that failed when live_info could not be added; null otherwise.
        hops:
          type: array
          description: Hops are hops 1..n in order; the origin is not a hop.
          items:
            $ref: '#/components/schemas/JumpRouteHop'
      required:
        - origin
        - origin_id
        - destination
        - destination_id
        - waypoints
        - ship
        - ship_group
        - skills
        - range_ly
        - fuel_type
        - fuel_per_ly
        - jumps
        - total_ly
        - total_fuel
        - fuel_volume_m3
        - can_bridge
        - can_conduit
        - prefer_stations
        - avoid
        - avoid_regions
        - avoid_incursions
        - incursion_systems
        - live_info
        - live_unavailable
        - hops
