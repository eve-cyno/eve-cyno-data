    Route:
      type: object
      properties:
        from:
          type: string
          description: 'From is the origin: the SDE''s canonical spelling in summary mode, as typed in route mode.'
        to:
          type: string
          description: 'To is the destination: the SDE''s canonical spelling in summary mode, as typed in route mode.'
        prefer_high_sec:
          type: boolean
          description: PreferHighSec is the request flag; HighsecSatisfied is false when no pure-highsec route exists and the path is the any-sec fallback (the text says so).
        highsec_satisfied:
          type: boolean
        jumps:
          type: integer
          description: Jumps is the full jump count of the route, also when systems is capped (see hops_omitted).
        systems:
          type: array
          description: 'Systems lists the stops, origin first: all of them for a route of up to 100 jumps, the first 101 stops (100 jumps) for a longer one; it is [] when Detail is "summary".'
          items:
            $ref: '#/components/schemas/RouteSystem'
        hops_omitted:
          type: integer
          description: HopsOmitted is how many systems at the end of the route Systems leaves out because a route lists at most 100 jumps; 0 when all are listed (Jumps counts the whole route).
        detail:
          type: string
          description: 'Detail is the requested output: "route" (the hop list) or "summary" (one line).'
        via:
          type: array
          description: Via lists the systems the route passes through, in order, as the SDE spells them.
          items:
            type: string
        avoid:
          type: array
          description: Avoid lists the systems the route never enters, as the SDE spells them; the origin, destination and via stops are never avoided, so they are not listed.
          items:
            type: string
        lowest_security_hop:
          description: LowestSecurityHop is the least secure system the route enters (the origin does not count); null for a 0-jump route.
          oneOf:
            - $ref: '#/components/schemas/RouteSystem'
            - type: "null"
        counts_by_class:
          $ref: '#/components/schemas/ClassCounts'
          description: CountsByClass counts the systems the route enters, by security band.
        highsec_only_jumps:
          type:
            - integer
            - "null"
          description: HighsecOnlyJumps is the jump count of a highsec-only route with the same via and avoid; null when it was not computed (prefer_high_sec is true) or none exists.
      required:
        - from
        - to
        - prefer_high_sec
        - highsec_satisfied
        - jumps
        - systems
        - hops_omitted
        - detail
        - via
        - avoid
        - lowest_security_hop
        - counts_by_class
        - highsec_only_jumps
