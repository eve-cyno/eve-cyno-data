openapi: 3.1.0
info:
  title: EVE-Cyno Data API
  summary: Deterministic EVE Online data, fit calculations and tools. No language model in the loop.
  description: |-
    Deterministic EVE Online data and calculations: community-fit search, fit breakdown and statistics (the Gofa dogma engine), SDE item search, and the tool layer behind the EVE-Cyno assistant, also reachable over MCP. Nothing here calls a language model; the same inputs give the same answers.

    ## Conventions

    - Errors are JSON, always: `{"error":{"code":"...","message":"..."}}`. The codes are stable (see `ErrorDetail`).
    - Every response carries `X-Request-ID`: your value when it is a token of 1-64 characters from `[A-Za-z0-9._-]`, otherwise a generated one.
    - Requests are rate limited per caller (a sliding window; the budget is stated on each operation): per API key when one is sent, otherwise per client IP. A refused request is `429` with `Retry-After`.
    - Request bodies are capped (256 KiB on the fit routes, 64 KiB on tools and MCP); an oversize body is `413`.
    - Tool tiers: each tool is *public* (no key), *keyed* (an API key), *byo-key* (your own Janice key) or *disabled*. Public: `search_item_by_name`, `get_ship_stats`, `get_ship_bonuses`, `find_canonical_module`, `get_hull_facts`, `validate_fitting`, `compute_fit_stats`, `get_production_chain`, `get_jumps_between`, `get_systems_in_region`, `get_npc_stations`, `get_reprocessing_yield`, `get_required_skills`. Keyed (send the key as `Authorization: Bearer <key>` or `X-API-Key`; `401 api_key_required` without one, `401 invalid_api_key` for a key that is not valid, on every tool): `get_market_price`, `get_type_info`, `get_fits`, `list_fits`, `analyze_battle`, `get_sovereignty`, `get_system_activity`. Byo-key (the `X-Janice-Key` request header, used for that request only and never logged or stored; `400 janice_key_required` without it): `appraise_items`. Disabled tools are not offered on this service (`403 tool_disabled` over REST, absent from the MCP tool list).

    ## Attribution and licences

    © 2014 Fenris Creations hf. All rights reserved. 'EVE', 'EVE Online', 'Fenris Creations', and all related logos and images are trademarks or registered trademarks of Fenris Creations hf. This material is used with limited permission of Fenris Creations. No official affiliation or endorsement by Fenris Creations is stated or implied. Created under the EVE Developer License Agreement.

    This service is non-commercial. Every tool answer names its upstream sources in `attribution`. Text derived from the EVE University Wiki (https://wiki.eveuniversity.org/) is licensed CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/).
  version: 0.1.0
servers:
  - url: /v1
    description: Paths in this document are relative to this URL.
tags:
  - name: fits
    description: Community-fit search and the deterministic fit breakdown, statistics and suggestions.
  - name: items
    description: SDE item search.
  - name: tools
    description: The deterministic tool layer behind the EVE-Cyno assistant, one operation per tool.
  - name: mcp
    description: The same tools over the Model Context Protocol.
  - name: meta
    description: Service health and the descriptions of this API.
paths:
  /fits/search:
    get:
      tags:
        - fits
      summary: Search community fits
      description: |-
        Searches the community-fit corpus (EVE Workbench, Abysstracker and other sources named in each hit). The facet parameters filter the corpus; with `q` a filtered vector search ranks the hits. When the facets match nothing they are relaxed one at a time, last first: `relaxed` is then true and `dropped` names what was removed. `ship` may be a loose hull name (`megath` finds Megathron). No language model is involved. Every hit carries an `attribution` object (`source`, `source_url`, `author` when known, `license`, `credit` and `license_url` when the terms require them); show it wherever you show the fit. The fits are community data served ranked and capped, not for bulk export.

        Rate limit: 120 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: searchFits
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: ship
          in: query
          required: false
          description: Hull name; a partial or loose name is resolved against the SDE.
          schema:
            type: string
        - name: activity
          in: query
          required: false
          description: Activity tag, e.g. `pve` or `pvp`.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Extra tag, e.g. `abyss` or `ratting`.
          schema:
            type: string
        - name: filament
          in: query
          required: false
          description: Abyssal filament type.
          schema:
            type: string
        - name: cost
          in: query
          required: false
          description: Cost class tag, e.g. `cheap`.
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: Restrict to one corpus source; empty searches the default source set.
          schema:
            type: string
        - name: clone
          in: query
          required: false
          description: '`alpha` keeps only alpha-clone fits, `omega` only omega-only fits; empty keeps both.'
          schema:
            type: string
            enum:
              - alpha
              - omega
        - name: q
          in: query
          required: false
          description: Free-text query; empty lists by the facets alone.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 'Maximum hits, clamped to 1-24 (the response `limit` and `note` say so). There is no offset, page or cursor: one query reaches one ranked page, and a request carrying such a parameter is refused with `invalid_request`.'
          schema:
            type: integer
            default: 24
      responses:
        "200":
          description: The ranked fits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitSearchResult'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/UpstreamError'
        "503":
          $ref: '#/components/responses/Unavailable'
  /fits/detail:
    post:
      tags:
        - fits
      summary: Describe a fit
      description: |-
        Parses an EFT block and returns its slots, CPU / powergrid / calibration use and ship class. Deterministic; DPS and EHP are not part of this view (see `/fit/stats`).

        Rate limit: 60 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: fitDetail
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FitDetailRequest'
      responses:
        "200":
          description: The fit breakdown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitDetail'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/UpstreamError'
        "503":
          $ref: '#/components/responses/Unavailable'
  /fit/stats:
    post:
      tags:
        - fits
      summary: Compute fit statistics
      description: |-
        Parses an EFT block and returns the Gofa engine's DPS, tank, capacitor, navigation, targeting and drone numbers. Deterministic; the same engine produces the numbers of the `compute_fit_stats` tool.

        Rate limit: 60 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: fitStats
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FitStatsRequest'
      responses:
        "200":
          description: The computed statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FitStats'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "502":
          $ref: '#/components/responses/UpstreamError'
        "503":
          $ref: '#/components/responses/Unavailable'
  /fit/suggest:
    post:
      tags:
        - fits
      summary: Suggest modules for an empty slot
      description: |-
        Ranks the modules that can fill a slot tier of the given fit: how often similar community fits carry them (when the corpus is up), their meta tier, and whether they fit the remaining CPU and powergrid. Without the corpus the ranking falls back to the SDE alone.

        Rate limit: 60 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: fitSuggest
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FitSuggestRequest'
      responses:
        "200":
          description: At most 12 ranked suggestions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Suggestion'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "503":
          $ref: '#/components/responses/Unavailable'
  /items/search:
    get:
      tags:
        - items
      summary: Search modules, charges and drones
      description: |-
        Name search over the SDE's fittable modules, charges or drones (the fitting palette's search).

        Rate limit: 120 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: searchItems
      parameters:
        - $ref: '#/components/parameters/RequestID'
        - name: q
          in: query
          required: true
          description: Name fragment; at least 2 characters.
          schema:
            type: string
            minLength: 2
        - name: kind
          in: query
          required: false
          description: What to search.
          schema:
            type: string
            enum:
              - module
              - charge
              - drone
            default: module
        - name: slot
          in: query
          required: false
          description: 'For modules: restrict to one slot tier.'
          schema:
            type: string
            enum:
              - high
              - mid
              - low
              - rig
        - name: limit
          in: query
          required: false
          description: Maximum hits.
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: The matching items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModuleHit'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/RateLimited'
        "503":
          $ref: '#/components/responses/Unavailable'
  /tool/get_market_price:
    post:
      tags:
        - tools
      summary: Get current market prices for an EVE Online item in The Forge region (Jita hub).
      description: |-
        Get current market prices for an EVE Online item in The Forge region (Jita hub). Returns best sell price, best buy price, and order counts.

        Sources: ESI (EVE Swagger Interface). `result.data` is a `MarketPrice` object when the call succeeds.

        Access tier: **keyed**. Send an API key (`Authorization: Bearer <key>` or `X-API-Key`); without one the answer is `401 api_key_required`.

        Rate limit: 30 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: get_market_price
      parameters:
        - $ref: '#/components/parameters/RequestID'
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type_id:
                  type: integer
                  description: The EVE type ID of the item (e.g. 34 for Tritanium, 44992 for PLEX)
                type_name:
                  type: string
                  description: Human-readable item name, for display only
              required:
                - type_id
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketPriceToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
  /tool/get_type_info:
    post:
      tags:
        - tools
      summary: 'Get information about an EVE Online item: name, description, volume, mass, group.'
      description: |-
        Get information about an EVE Online item: name, description, volume, mass, group.

        Sources: ESI (EVE Swagger Interface). `result.data` is a `TypeInfo` object when the call succeeds.

        Access tier: **keyed**. Send an API key (`Authorization: Bearer <key>` or `X-API-Key`); without one the answer is `401 api_key_required`.

        Rate limit: 30 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: get_type_info
      parameters:
        - $ref: '#/components/parameters/RequestID'
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type_id:
                  type: integer
                  description: The EVE type ID
              required:
                - type_id
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeInfoToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
  /tool/search_item_by_name:
    post:
      tags:
        - tools
      summary: Resolve one or more EVE Online item, ship, or module names to their type_id.
      description: |-
        Resolve one or more EVE Online item, ship, or module names to their type_id. Call this BEFORE get_market_price or get_type_info when you only have a name, not a type_id.

        Sources: EVE Static Data Export (via Fuzzwork).

        Access tier: **public**. No key needed.

        Rate limit: 30 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: search_item_by_name
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  type: array
                  description: List of item/ship/module names to resolve, e.g. ['Stabber', 'PLEX', 'Gila']
                  items:
                    type: string
              required:
                - names
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
  /tool/get_ship_stats:
    post:
      tags:
        - tools
      summary: Get slot layout, hardpoints, and resource limits for an EVE Online ship.
      description: |-
        Get slot layout, hardpoints, and resource limits for an EVE Online ship. Call this BEFORE generating a fit to know exact hi/mid/low/rig slot counts, turret and launcher hardpoints, CPU capacity (tf), and powergrid capacity (MW). Using these values prevents generating fits that exceed slot or resource limits.

        Sources: EVE Static Data Export (via Fuzzwork). `result.data` is a `ShipStats` object when the call succeeds.

        Access tier: **public**. No key needed.

        Rate limit: 30 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: get_ship_stats
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ship_name:
                  type: string
                  description: The ship type name, e.g. 'Vexor', 'Rifter', 'Stabber', 'Gila'
              required:
                - ship_name
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipStatsToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
  /tool/get_ship_bonuses:
    post:
      tags:
        - tools
      summary: Get hull bonuses for an EVE Online ship — per-skill-level bonuses + role bonuses + ship class.
      description: |-
        Get hull bonuses for an EVE Online ship — per-skill-level bonuses + role bonuses + ship class. Call this BEFORE generating a fit so you pick the bonused weapon system (Caldari hybrid vs missile, Gallente drone vs hybrid, Minmatar projectile vs missile, Amarr laser; pirate hulls have specific role bonuses like web range or ECM). The response names every per-skill bonus and any role bonus from the ship's ESI description — use those to decide weapons, modules, and tank type.

        Sources: EVE Static Data Export (via Fuzzwork); EVE Workbench.

        Access tier: **public**. No key needed.

        Rate limit: 30 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: get_ship_bonuses
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ship_name:
                  type: string
                  description: Ship type name, e.g. 'Hawk', 'Stabber Fleet Issue', 'Daredevil', 'Gila'
              required:
                - ship_name
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
  /tool/find_canonical_module:
    post:
      tags:
        - tools
      summary: Look up canonical SDE typeNames for a module family (e.g. 'Steel Plates', 'Entropic Radiation Sink', 'Shield Extender'…
      description: |-
        Look up canonical SDE typeNames for a module family (e.g. 'Steel Plates', 'Entropic Radiation Sink', 'Shield Extender', 'Heat Sink', 'Magnetic Field Stabilizer', 'Ballistic Control System', 'Stasis Webifier', 'Microwarpdrive', 'Remote Armor Repairer'). Call this when you are about to write a module that isn't in the `compatible_weapons` or `bonused_modules` of get_hull_facts and you are not 100% sure of the canonical name. Optional `size` narrows to a class prefix — 'Small' for frigates / destroyers, 'Medium' for cruisers / battlecruisers, 'Large' for battleships and capitals. Returns a short list of real published items (no SKINs / Blueprints / Specializations).

        Sources: EVE Static Data Export (via Fuzzwork).

        Access tier: **public**. No key needed.

        Rate limit: 30 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: find_canonical_module
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                family:
                  type: string
                  description: Module family substring, e.g. 'Steel Plates', 'Entropic Radiation Sink', 'Tracking Enhancer'
                size:
                  type: string
                  description: Optional size class — 'Small', 'Medium', or 'Large'
              required:
                - family
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
  /tool/get_hull_facts:
    post:
      tags:
        - tools
      summary: Authoritative SDE snapshot of a hull's fitting envelope — slot/hardpoint counts, drone bay, role/skill bonuses, AND the…
      description: |-
        Authoritative SDE snapshot of a hull's fitting envelope — slot/hardpoint counts, drone bay, role/skill bonuses, AND the canonical list of weapons that hull is restricted to fit (when EVE encodes a per-hull weapon lock). Call this BEFORE writing an EFT block on any unfamiliar / specialist hull (Triglavian battleships Leshak / Drekavac → Supratidal Entropic Disintegrators; Triglavian frigates → Light variants; Triglavian cruisers → Heavy variants; pirate / faction hulls). When `compatible_weapons` is non-empty, USE ONLY those typeNames — anything else will be rejected by validate_fitting. When `compatible_weapons` is empty there is no per-hull lock; rely on `role_bonuses` (which carry the bonused weapon family like 'Small Hybrid Turret' or 'Light Missile') and standard hardpoint sizing.

        Sources: EVE Static Data Export (via Fuzzwork); EVE Workbench.

        Access tier: **public**. No key needed.

        Rate limit: 30 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: get_hull_facts
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ship_name:
                  type: string
                  description: Ship type name, e.g. 'Leshak', 'Hecate', 'Vedmak', 'Damavik'
              required:
                - ship_name
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
  /tool/get_fits:
    post:
      tags:
        - tools
      summary: Retrieve community ship fits VERBATIM from the indexed fit database (EVE Workbench + Abysstracker +…
      description: |-
        Retrieve community ship fits VERBATIM from the indexed fit database (EVE Workbench + Abysstracker + gustavmannfred.streamlit.app + caldarijoans.streamlit.app, ~8150 fits). Use this FIRST whenever the user asks for popular / community / top / proven / 'most-used' / meta / 'best' / Gustav's / CaldariJoans' fits — never invent a fit when this tool can answer. Returns the raw EFT text (header + modules + drones + ammo) and the source URL for each match. Filter by ship_name (exact), activity (pvp / pve / hauler / exploration / mining / logistics), context (wh, abyss, abyss-electrical / firestorm / exotic / gamma / dark, abyss-t1..t6, ratting, solo), cost_class (cheap < 50M / mid 50-500M / blingy > 500M ISK), alpha_clone (true for Alpha-skill-friendly), combat_role (solo / fleet / elite-flown — zKillboard only). If 0 matches, returns 'NO FITS FOUND' — follow the STEP decision tree: try ONE retry with the most restrictive filter dropped, then proceed to STEP 2 and generate a theorycrafted fit from game knowledge. NEVER tell the user this tool returned empty.

        Sources: EVE Workbench; Abysstracker; gustavmannfred (abyss fits); caldarijoans (abyss fits); zKillboard. `result.data` is a `CommunityFits` object when the call succeeds.

        Access tier: **keyed**. Send an API key (`Authorization: Bearer <key>` or `X-API-Key`); without one the answer is `401 api_key_required`.

        Rate limit: 30 requests per minute per caller (per API key when one is sent, otherwise per client IP).
      operationId: get_fits
      parameters:
        - $ref: '#/components/parameters/RequestID'
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                activity:
                  type: string
                  description: Activity the fit is meant for.
                  enum:
                    - pvp
                    - pve
                    - hauler
                    - exploration
                    - mining
                    - logistics
                alpha_clone:
                  type: boolean
                  description: If true, only return fits flyable on Alpha skills.
                combat_role:
                  type: string
                  description: Workbench-derived role tag for PvP fits.
                  enum:
                    - solo
                    - fleet
                context:
                  type: string
                  description: 'Subcontext tag. Examples: ''wh'' (wormhole), ''abyss'' (any abyss), ''abyss-electrical'', ''abyss-firestorm'', ''abyss-exotic'', ''abyss-gamma'', ''abyss-dark'', ''abyss-t1'', ''abyss-t2'', ''abyss-t3'', ''abyss-t4'', ''abyss-t5'', ''abyss-t6'', ''ratting'', ''solo''.'
                cost_class:
                  type: string
                  description: cheap (< 50M ISK), mid (50-500M), blingy (> 500M).
                  enum:
                    - cheap
                    - mid
                    - blingy
                limit:
                  type: integer
                  description: Max number of fits to return (default 5, hard max 10).
                ship_name:
                  type: string
                  description: 'Exact EVE ship name. Examples: ''Tengu'', ''Gila'', ''Hurricane Fleet Issue'', ''Vexor Navy Issue''. Leave empty to search across all ships matching the other filters.'
                source:
                  type: string
                  description: Restrict to one source. Leave empty to search all sources. Use 'gustavmannfred' for Gustav's abyss fits (gustavmannfred.streamlit.app), 'caldarijoans' for CaldariJoans' abyss fits (caldarijoans.streamlit.app). Pass this when the user explicitly asks for a specific author's fit.
                  enum:
                    - workbench
                    - abysstracker
                    - gustavmannfred
                    - caldarijoans
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityFitsToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
