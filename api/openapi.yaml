      summary: Get the activity of EVE solar systems in the last hour from ESI.
      description: |-
        Get the activity of EVE solar systems in the last hour from ESI. Pass systems (up to 50 names) for one line per system with jumps, ship kills, pod kills and NPC kills; system_name (one system) is the older form and answers kills only. Use for 'how busy is X', 'how many kills in Y recently', 'is it safe to undock'.

        Sources: EVE Static Data Export (via Fuzzwork); ESI (EVE Swagger Interface). `result.data` is a `ActivityList` object when called with `systems` (null for the single `system_name` form).

        Access tier: **public**. No key needed.

        Rate limit: 10 requests per minute per client IP without an API key, 60 per minute per API key with one.

        Reads live public data from EVE's ESI through a shared cache that follows ESI's `Expires`. All live-upstream calls share one fair-use limit of 5 calls per minute per caller without an API key and 10 with one (REST and MCP together, counted across every live tool), on top of the route limit. When the shared ESI budget is nearly spent the call is refused with `503 upstream_busy` (MCP: an error result starting `upstream_busy`) and `Retry-After`; retry later.
      operationId: get_system_activity
      parameters:
