          description: Kind is "blueprint" (built from a manufacturing blueprint) or "planetary" (made from a planetary schematic).
        runs:
          type: integer
          description: Runs is the number of manufacturing runs asked for.
        me_level:
          type:
            - integer
            - "null"
          description: MELevel is the material efficiency level of every blueprint in the chain (0-10); null for a planetary chain, which has none.
        materials:
          type: array
          description: Materials are the leaf materials the whole chain consumes, most units first. The text lists the first 30.
          items:
            $ref: '#/components/schemas/ChainMaterial'
        steps:
          type: array
          description: Steps are the production steps of a planetary chain, empty for a blueprint chain.
          items:
            $ref: '#/components/schemas/PlanetaryStep'
        cost:
          description: Cost is the build cost in ISK; null unless include_cost or system is set, and when the ESI price list could not be read.
          oneOf:
            - $ref: '#/components/schemas/ChainCost'
            - type: "null"
