  /tool/get_fits:
    post:
      tags:
        - tools
      summary: Retrieve community ship fits from the indexed fit database, with author and source link for each.
      description: |-
        Retrieve community ship fits from the indexed fit database, with author and source link for each. Returns the raw EFT text (header + modules + drones + ammo) and the source URL for each match. Filter by ship_name (exact), activity (pvp / pve / hauler / exploration / mining / logistics), context (wh, abyss, abyss-electrical / firestorm / exotic / gamma / dark, abyss-t1..t6, ratting, solo), cost_class (cheap < 50M / mid 50-500M / blingy > 500M ISK), alpha_clone (true for Alpha-skill-friendly), combat_role (solo / fleet — zKillboard only), source (workbench / abysstracker / gustavmannfred / caldarijoans: restrict to one source), limit (default 5, at most 10), fit_id (fetch one fit by the id that list_fits and get_fits print; the other filters are ignored), include_eft (false leaves the EFT blocks out and lists the ids only). If nothing matches, the answer says 'NO FITS FOUND'; dropping the most restrictive filter may find some.

        Sources: EVE Workbench; Abysstracker; gustavmannfred (abyss fits); caldarijoans (abyss fits); zKillboard. `result.data` is a `CommunityFits` object when the call succeeds.

        Access tier: **public**. No key needed.

        Rate limit: 10 requests per minute per client IP without an API key, 60 per minute per API key with one.
      operationId: get_fits
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                activity:
                  type: string
                  description: Activity the fit is meant for.
                  enum:
                    - pvp
                    - pve
                    - hauler
                    - exploration
                    - mining
                    - logistics
                alpha_clone:
                  type: boolean
                  description: If true, only return fits flyable on Alpha skills.
                combat_role:
                  type: string
                  description: Workbench-derived role tag for PvP fits.
                  enum:
                    - solo
                    - fleet
                context:
                  type: string
                  description: 'Subcontext tag. Examples: ''wh'' (wormhole), ''abyss'' (any abyss), ''abyss-electrical'', ''abyss-firestorm'', ''abyss-exotic'', ''abyss-gamma'', ''abyss-dark'', ''abyss-t1'', ''abyss-t2'', ''abyss-t3'', ''abyss-t4'', ''abyss-t5'', ''abyss-t6'', ''ratting'', ''solo''.'
                cost_class:
                  type: string
                  description: cheap (< 50M ISK), mid (50-500M), blingy (> 500M).
                  enum:
                    - cheap
                    - mid
                    - blingy
                fit_id:
                  type: string
                  description: 'Fetch one fit by its id (a UUID from the id= field of get_fits or list_fits). The other filters are ignored. Example: ''6f1d3b2a-0c4e-5a7b-9d8e-1f2a3b4c5d6e''.'
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                include_eft:
                  type: boolean
                  description: Default true. false leaves the EFT blocks out and lists only the meta line and id of each fit, to browse cheaply before fetching one with fit_id.
                limit:
                  type: integer
                  description: Max number of fits to return (default 5, hard max 10).
                ship_name:
                  type: string
                  description: 'Exact EVE ship name. Examples: ''Tengu'', ''Gila'', ''Hurricane Fleet Issue'', ''Vexor Navy Issue''. Leave empty to search across all ships matching the other filters.'
                source:
                  type: string
                  description: Restrict to one source. Leave empty to search all sources. Use 'gustavmannfred' for Gustav's abyss fits (gustavmannfred.streamlit.app), 'caldarijoans' for CaldariJoans' abyss fits (caldarijoans.streamlit.app). Pass this when the user explicitly asks for a specific author's fit.
                  enum:
                    - workbench
                    - abysstracker
                    - gustavmannfred
                    - caldarijoans
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityFitsToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
