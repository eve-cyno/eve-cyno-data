  /tool/get_npc_stations:
    post:
      tags:
        - tools
      summary: List NPC stations, and find mission agents (for example the nearest level 4 security agent).
      description: |-
        List NPC stations, and find mission agents (for example the nearest level 4 security agent). With only system_name it lists that system's stations with owner and operation: use it for 'stations in X' or 'where can I dock'. With near, region, services, agent or limit it searches stations, nearest first (by gate jumps from near.origin), with owner, services, the refinery yield (Reprocessing Plant stations) and the matching agents, up to 50 per call with the total. Every agent in this build sits at a station, so 'nearest level 4 security agent to Dodixie' is the nearest station with such an agent. Example: {"near":{"origin":"Dodixie","max_jumps":5},"agent":{"level":4,"division":"security"},"limit":3}. Another: stations within 1 jump of Dodixie with repair facilities: {"near":{"origin":"Dodixie","max_jumps":1},"services":["Repair Facilities"]}.

        Sources: EVE Static Data Export (via Fuzzwork). `result.data` is a `StationList` object when the call succeeds.

        Access tier: **public**. No key needed.

        Rate limit: 10 requests per minute per client IP without an API key, 60 per minute per API key with one.
      operationId: get_npc_stations
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent:
                  type: object
                  description: Keep stations with at least one matching agent, and list those agents, e.g. {"level":4,"division":"security"} or {"kind":"research","faction":"Gallente Federation"}.
                  properties:
                    corporation:
                      type: string
                      description: NPC corporation name, e.g. 'Federation Navy'
                    division:
                      type: string
                      description: 'Agent division: security, distribution, mining or research (R&D)'
                      enum:
                        - security
                        - distribution
                        - mining
                        - research
                    faction:
                      type: string
                      description: Faction name, e.g. 'Gallente Federation'; keeps the agents of its corporations
                    kind:
                      type: string
                      description: Agent kind (default mission, the ordinary mission agent)
                      enum:
                        - mission
                        - research
                        - faction_warfare
                        - storyline
                        - epic_arc
                        - career
                        - concord
                        - any
                    level:
                      type: integer
                      description: Agent level (1-5)
                      minimum: 1
                      maximum: 5
                    locator:
                      type: boolean
                      description: true keeps only agents that offer the locator service
                limit:
                  type: integer
                  description: Stations to list (1-50, default 20)
                  minimum: 1
                  maximum: 50
                near:
                  type: object
                  description: Rank stations by gate jumps from an origin system, nearest first, e.g. {"origin":"Dodixie","max_jumps":5}. Without max_jumps every reachable system is ranked.
                  properties:
                    max_jumps:
                      type: integer
                      description: Keep stations at most this many jumps away (1-30)
                      minimum: 1
                      maximum: 30
                    origin:
                      type: string
                      description: Solar system name the jumps are counted from, e.g. 'Dodixie'
                    prefer_high_sec:
                      type: boolean
                      description: Count jumps through highsec where a highsec-only route exists, else through any space
                  required:
                    - origin
                region:
                  type: string
                  description: Region name, e.g. 'Sinq Laison'
                services:
                  type: array
                  description: Station services a station must all offer, e.g. ['Repair Facilities', 'Reprocessing Plant']. Same names as find_systems station_services.
                  items:
                    type: string
                  maxItems: 12
                system_name:
                  type: string
                  description: Solar system name, e.g. 'Hek', 'Jita'. Alone it lists that system's stations; with search parameters it limits the search to that system.
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationListToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
