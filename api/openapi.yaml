      properties:
        ship_name:
          type: string
        fit_name:
          type: string
        source:
          type: string
        source_url:
          type: string
        tags:
          type: array
          items:
            type: string
        score:
          type: number
        eft:
          type: string
        attribution:
          $ref: '#/components/schemas/Attribution'
      required:
