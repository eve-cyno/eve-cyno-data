        group:
          type: string
        category_id:
          type: integer
          description: CategoryID and Category are the group's category ("Module", "Ship").
        category:
          type: string
        meta_group:
          type:
            - string
            - "null"
          description: MetaGroup is the meta group ("Tech II", "Faction"); null when the SDE has none for the item.
        meta_level:
          type:
            - integer
            - "null"
          description: MetaLevel is the SDE meta level (0 for Tech I); null when the SDE leaves it empty.
        tech_level:
          type:
            - integer
            - "null"
          description: TechLevel is 1, 2 or 3; null when the SDE leaves it empty.
        market_group_path:
          type: array
          description: MarketGroupPath names the market groups from the root down; [] when the item has no market group.
          items:
            type: string
        base_price:
          type:
            - number
            - "null"
          description: BasePrice is the SDE base price in ISK, not a market price; null when the SDE leaves it empty.
        portion_size:
          type: integer
          description: PortionSize is how many units one reprocessing or production portion covers (1 when the SDE leaves it empty).
        volume_m3:
          type: number
          description: VolumeM3 is the volume in m³; for a ship, the assembled volume.
        packaged_volume_m3:
          type:
            - number
            - "null"
          description: PackagedVolumeM3 is the volume once packaged; null when the SDE leaves it empty.
        capacity_m3:
          type: number
          description: CapacityM3 is the cargo or hold capacity in m³.
        mass_kg:
          type: number
          description: MassKg is the mass in kg.
        alpha_usable:
          type:
            - boolean
            - "null"
          description: AlphaUsable says whether an Alpha clone can use the item (every skill it needs is within the Alpha caps); null when the Alpha list is unavailable and for NPC types.
