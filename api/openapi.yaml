        - willpower
        - intelligence
        - charisma
        - best_remap_per_skill
    TypeInfo:
      type: object
      properties:
        type_id:
          type: integer
        name:
          type: string
        description:
          type: string
          description: Description is the whole description, tags and all; Text cuts it at 400 bytes.
        volume_m3:
          type: number
        mass_kg:
          type: number
        group_id:
          type: integer
        meta_group:
          type:
            - string
            - "null"
          description: MetaGroup is the item's meta group ("Tech II", "Faction"); null when the SDE has none for it (a mineral, say) or does not know the type. It is never guessed as "Tech I".
        meta_level:
          type:
            - integer
            - "null"
          description: MetaLevel is the SDE meta level (0 for Tech I); null when the SDE leaves it empty.
        tech_level:
          type:
            - integer
            - "null"
          description: TechLevel is 1, 2 or 3; null when the SDE leaves it empty.
        market_group_path:
          type: array
          description: MarketGroupPath names the market groups from the root down, e.g. Ship Equipment, Hull & Armor, Damage Controls; [] when the type has no market group.
          items:
            type: string
        base_price:
          type:
            - number
            - "null"
          description: BasePrice is the SDE base price in ISK, not a market price; null when the SDE leaves it empty.
        portion_size:
          type:
            - integer
            - "null"
          description: PortionSize is how many units one reprocessing or production portion covers; null when the SDE does not know the type.
        packaged_volume_m3:
          type:
            - number
            - "null"
          description: PackagedVolumeM3 is the volume once the ship is packaged; null when the SDE leaves it empty.
        capacity_m3:
          type:
            - number
            - "null"
          description: CapacityM3 is the cargo or hold capacity in m³; null when the SDE does not know the type.
      required:
        - type_id
