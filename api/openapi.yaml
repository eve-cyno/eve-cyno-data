  /tool/find_systems:
    post:
      tags:
        - tools
      summary: 'Find solar systems by filters and rank them: security band, region, constellation, faction, wormhole class, NPC station…'
      description: |-
        Find solar systems by filters and rank them: security band, region, constellation, faction, wormhole class, NPC station and its services, asteroid belts, planet types, ice belts (EVE University's list of highsec and lowsec ice systems) and distance from an origin (near). One line per system, up to 100 per call (page with offset), with the total. Example, the three nearest highsec Clear Icicle systems to C-N4OD: {"security":{"min":0.45},"ice_types":["Clear Icicle"],"near":{"origin":"C-N4OD"},"sort":"jumps","limit":3}. Set jump_range {origin, ship, jump_drive_calibration (default 5)} to keep the systems that ship can jump to from the origin (cyno-able: lowsec or nullsec, not wormhole space, Pochven or Zarzakh; 'Jump Bridge' = Ansiblex reach), with the light-years, sorted nearest first; e.g. the nearest lowsec NPC-station systems a Rorqual can reach from EC-P8R: {"jump_range":{"origin":"EC-P8R","ship":"Rorqual"},"security":{"min":0.1,"max":0.4},"has_npc_station":true,"limit":3}.

        Sources: EVE Static Data Export (via Fuzzwork); EVE University Wiki (ice belt systems). `result.data` is a `SystemList` object when the call succeeds.

        Access tier: **public**. No key needed.

        Rate limit: 10 requests per minute per client IP without an API key, 60 per minute per API key with one.
      operationId: find_systems
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                constellation:
                  type: string
                  description: Constellation name, e.g. 'Kimotoro'
                faction:
                  type: string
                  description: Faction name, e.g. 'Caldari State'
                has_ice_belt:
                  type: boolean
                  description: true for systems EVE University lists with ice belts, false for systems it does not list (nullsec ice systems are not covered)
                has_npc_station:
                  type: boolean
                  description: true for systems with an NPC station, false for systems without
                ice_types:
                  type: array
                  description: Ice types, e.g. ['Clear Icicle', 'Blue Ice']; a system matches when it has any of them; implies has_ice_belt
                  items:
                    type: string
                  maxItems: 12
                jump_range:
                  type: object
                  description: Keep the systems a ship can jump to from an origin, with the light-years, nearest first, e.g. {"origin":"EC-P8R","ship":"Rorqual"}.
                  properties:
                    jump_drive_calibration:
                      type: integer
                      description: Jump Drive Calibration level 0-5 (default 5); it sets the range
                      minimum: 0
                      maximum: 5
                    origin:
                      type: string
                      description: Solar system name the jump starts in, e.g. 'EC-P8R' (lowsec or nullsec)
                    ship:
                      type: string
                      description: Hull name, e.g. 'Rorqual', 'Rhea', 'Avatar', or 'Jump Bridge' for Ansiblex jump bridges
                  required:
                    - origin
                    - ship
                limit:
                  type: integer
                  description: Systems per call (default 20, at most 100)
                  minimum: 1
                  maximum: 100
                min_asteroid_belts:
                  type: integer
                  description: At least this many asteroid belts, e.g. 3
                  minimum: 0
                near:
                  type: object
                  description: Rank by gate jumps from an origin system and leave out systems with no gate route, e.g. {"origin":"C-N4OD","max_jumps":10}. Without max_jumps every reachable system is ranked.
                  properties:
                    max_jumps:
                      type: integer
                      description: Keep systems at most this many jumps away (1-30)
                      minimum: 1
                      maximum: 30
                    origin:
                      type: string
                      description: Solar system name the jumps are counted from, e.g. 'C-N4OD'
                    prefer_high_sec:
                      type: boolean
                      description: Count jumps through highsec where a highsec-only route exists, else through any space (the line says '(no highsec-only route)')
                  required:
                    - origin
                offset:
                  type: integer
                  description: Systems to skip, to read the next page (default 0)
                  minimum: 0
                planet_types:
                  type: array
                  description: Planet types the system must have at least one of each, e.g. ['Lava', 'Gas']; an unknown name lists the valid ones
                  items:
                    type: string
                  maxItems: 12
                region:
                  type: string
                  description: Region name, e.g. 'The Forge'
                security:
                  type: object
                  description: 'Security band as shown in game, e.g. 0.5 includes systems with true security 0.45-0.5: {"min":0.5} is highsec, {"max":0.4} is lowsec and below. Wormhole systems carry a security of about -1.0; filter them with wormhole_class (7, 8 and 9 are known-space highsec, lowsec and nullsec).'
                  properties:
                    max:
                      type: number
                      description: Highest displayed security, e.g. 0.9
                    min:
                      type: number
                      description: Lowest displayed security, e.g. 0.5
                sort:
                  type: string
                  description: 'Order: jumps (needs near; the default with near), security (most secure first), name (the default) or ly (needs jump_range; the default with jump_range)'
                  enum:
                    - jumps
                    - security
                    - name
                    - ly
                station_services:
                  type: array
                  description: Station services every match must offer, e.g. ['Reprocessing Plant', 'Factory']; an unknown name lists the valid ones
                  items:
                    type: string
                  maxItems: 12
                wormhole_class:
                  type: integer
                  description: 'Wormhole class: 1-6 for C1-C6, 7 highsec, 8 lowsec, 9 nullsec, 12 Thera, 13 shattered frigate holes, 14-18 Drifter, 25 Pochven'
              required: []
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemListToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
  /tool/get_system_info:
    post:
      tags:
