      operationId: get_jump_distances
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                avoid:
                  type: array
                  description: Systems never to pass through (up to 20), e.g. ['Ahbazon']; a target you also list here still gets its own count, but no route passes through it.
                  items:
                    type: string
                  maxItems: 20
                origin:
                  type: string
                  description: Origin solar system name, e.g. 'C-N4OD'
                prefer_high_sec:
                  type: boolean
                  description: If true, count highsec-only routes where one exists (default false)
                systems:
                  type: array
                  description: Solar system names to measure, e.g. ['Elonaya','Uchomida','Actee']
