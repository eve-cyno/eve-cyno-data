  /tool/get_thera_connections:
    post:
      tags:
        - tools
      summary: Live wormhole connections from Thera and Turnur into known space and wormhole space, from EvE-Scout (Signal Cartel's…
      description: |-
        Live wormhole connections from Thera and Turnur into known space and wormhole space, from EvE-Scout (Signal Cartel's public scanning data; credit them as EvE-Scout / Signal Cartel). One line per connection: the exit system with its security and region, wormhole type and largest ship size, hours left and both signature ids. Set near {origin, max_jumps} to keep the exits closest to a system, sorted by jumps. Connections change every few hours.

        Sources: EvE-Scout / Signal Cartel; EVE Static Data Export (via Fuzzwork). `result.data` is a `TheraConnections` object when the call succeeds.

        Access tier: **public**. No key needed.

        Rate limit: 10 requests per minute per client IP without an API key, 60 per minute per API key with one.

        Reads live Thera and Turnur connections from EvE-Scout (Signal Cartel) through a shared cache that follows its cache headers (one to ten minutes, five when they set none). When EvE-Scout does not answer, it serves its last copy if that is at most an hour old, with the copy's time in `as_of`; otherwise `result.text` says the connections are unavailable. All live-upstream calls share one fair-use limit of 5 calls per minute per caller without an API key and 10 with one (REST and MCP together, counted across every live tool), on top of the route limit.
      operationId: get_thera_connections
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hub:
                  type: string
                  description: 'Which hub''s connections: ''thera'', ''turnur'' or ''all'' (default)'
                  enum:
                    - thera
                    - turnur
                    - all
                limit:
                  type: integer
                  description: Most connections to list (1-50, default 20); the answer says how many more there are
                  minimum: 1
                  maximum: 50
                near:
                  type: object
                  description: Keep the exits with a gate route to an origin system and sort them by jumps, e.g. {"origin":"Jita","max_jumps":10}. Exits with no gate route from the origin are left out (counted in the answer).
                  properties:
                    max_jumps:
                      type: integer
                      description: Keep exits at most this many jumps away (1-30); omit to rank every exit with a gate route
                      minimum: 1
                      maximum: 30
                    origin:
                      type: string
                      description: Solar system name the jumps are counted from, e.g. 'Jita'
                  required:
                    - origin
      responses:
        "200":
          description: The tool's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TheraConnectionsToolResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/Unavailable'
        "504":
          $ref: '#/components/responses/Timeout'
  /mcp:
    post:
      tags:
        - mcp
      summary: Model Context Protocol endpoint
      description: |-
        Streamable-HTTP MCP server (stateless, JSON responses): the same tools as `/tool/{name}`, for MCP clients such as Claude Desktop or Claude Code. POST one JSON-RPC 2.0 message per request (`initialize`, `tools/list`, `tools/call`, ...); a notification is answered `202` with no body. `GET` and `DELETE` are not supported in stateless mode (405). Point a client at this URL; it is not meant to be called by hand.

        Rate limit: 20 requests per minute per client IP without an API key, 120 per minute per API key with one.
      operationId: mcp
      parameters:
        - $ref: '#/components/parameters/RequestID'
      security:
        - {}
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification (see https://modelcontextprotocol.io/specification).
              properties:
                jsonrpc:
                  const: "2.0"
                id:
                  type:
                    - string
                    - integer
                method:
                  type: string
                  examples:
                    - tools/list
                params:
                  type: object
              required:
                - jsonrpc
                - method
      responses:
        "200":
          description: The JSON-RPC 2.0 response.
          content:
            application/json:
              schema:
                type: object
                description: 'A JSON-RPC 2.0 response: `result` on success, `error` otherwise.'
                properties:
                  jsonrpc:
                    const: "2.0"
                  id:
                    type:
                      - string
                      - integer
                      - "null"
                  result:
                    type: object
                  error:
                    type: object
                required:
                  - jsonrpc
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "413":
          $ref: '#/components/responses/PayloadTooLarge'
        "429":
          $ref: '#/components/responses/RateLimited'
  /health:
    get:
      tags:
        - meta
      summary: Liveness probe
      description: Always 200 while the process serves; a degraded dependency shows in the body, never in the status. The flags say which dependencies loaded, so a degraded service (no SDE, no fit corpus) can be told from a healthy one. `corpus` is true only when the fit corpus is configured and its backend answered a probe (cached for 30 seconds, 1 second timeout); `corpus_configured` is true when a corpus is wired at all, reachable or not. `sde_build` is the build id of the SDE the service reads, when known.
      operationId: health
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
  /openapi.yaml:
    get:
      tags:
        - meta
      summary: This API description (YAML)
      description: |-
        The OpenAPI 3.1 document of this service, generated from its route table and tool registry.

        Rate limit: 60 requests per minute per client IP without an API key, 120 per minute per API key with one.
      operationId: openapiYaml
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "429":
          $ref: '#/components/responses/RateLimited'
  /openapi.json:
    get:
      tags:
        - meta
      summary: This API description (JSON)
      description: |-
        The same OpenAPI 3.1 document as JSON.

        Rate limit: 60 requests per minute per client IP without an API key, 120 per minute per API key with one.
      operationId: openapiJson
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        "429":
          $ref: '#/components/responses/RateLimited'
components:
  schemas:
    ActivityList:
      type: object
      properties:
        systems:
          type: array
          description: Systems holds one row per resolved system, in request order, duplicates collapsed.
          items:
            $ref: '#/components/schemas/SystemActivity'
        unresolved:
          type: array
          description: Unresolved lists requested names that are not solar systems.
          items:
            type: string
      required:
        - systems
        - unresolved
    ActivityListToolResponse:
      type: object
      properties:
        tool:
          type: string
          description: The tool that ran.
        version:
          type: string
          description: The build version of the service.
        result:
          type: object
          properties:
            text:
              type: string
              description: The answer as the chat assistant reads it.
            data:
              description: The typed answer, or null when the tool has none or the call ended in a text-only answer (an unknown id, a parse failure); `text` then says why.
              oneOf:
                - $ref: '#/components/schemas/ActivityList'
                - type: "null"
          required:
            - text
            - data
        attribution:
          type: array
          description: The upstreams behind the answer; attribution is a condition of several of their licences.
          items:
            $ref: '#/components/schemas/Source'
      required:
        - tool
        - version
        - result
        - attribution
    AgentRow:
      type: object
      properties:
        agent_id:
          type: integer
          description: AgentID is the agent's id.
        name:
          type: string
          description: Name is the agent's name.
        level:
          type: integer
          description: Level is the agent level, 1 to 5.
        division:
          type: string
          description: Division is the NPC division, for example "Security", "Distribution", "Mining" or "R&D".
        kind:
          type: string
          description: Kind is "mission", "research", "faction_warfare", "storyline", "epic_arc", "career", "concord" or the lowercase SDE agent type for any other.
        corporation:
          type: string
          description: Corporation is the agent's corporation.
        locator:
          type: boolean
          description: Locator is true when the agent offers the locator service.
      required:
        - agent_id
        - name
        - level
        - division
        - kind
        - corporation
        - locator
    Attribution:
      type: object
      properties:
        source:
          type: string
          description: Source is the corpus source (workbench, abysstracker, ...) or, for wiki text, the page title.
        source_url:
          type: string
          description: 'SourceURL is the link to the original page or fit. Never empty for a hit served by a fit path: the ingest writers refuse a fit without one.'
        author:
          type: string
          description: Author is the person behind the fit when the corpus knows one.
        license:
          type: string
          description: License is the short statement of the terms the data is used under.
        license_url:
          type: string
          description: LicenseURL links the licence text, where there is one.
        credit:
          type: string
          description: Credit is who must be credited next to the text ("EVE University" for wiki text).
      required:
        - source
        - source_url
        - license
    AveragePrice:
      type: object
      properties:
        type_id:
          type: integer
          description: TypeID is the item's type ID.
        name:
          type: string
          description: Name is the item name as the SDE spells it.
        average_isk:
          type:
            - number
            - "null"
          description: AverageISK is EVE's average price in ISK, null when the item has none.
      required:
        - type_id
        - name
        - average_isk
    AveragePrices:
      type: object
      properties:
        as_of:
          type:
            - string
            - "null"
          description: AsOf is the date (YYYY-MM-DD, UTC) of the price list the numbers come from; null when no price list was read (every item was unknown).
        source:
          type: string
          description: 'Source names the upstream: "ESI /markets/prices".'
        prices:
          type: array
          description: Prices has one row per distinct item, in the order first asked.
          items:
            $ref: '#/components/schemas/AveragePrice'
        unresolved:
          type: array
          description: Unresolved lists names that are not items, and type IDs that are not in the SDE or not whole numbers (as "type_id N"); names are listed trimmed.
          items:
            type: string
      required:
        - as_of
        - source
        - prices
        - unresolved
    AveragePricesToolResponse:
      type: object
      properties:
        tool:
          type: string
          description: The tool that ran.
        version:
          type: string
          description: The build version of the service.
        result:
          type: object
          properties:
            text:
              type: string
              description: The answer as the chat assistant reads it.
            data:
              description: The typed answer, or null when the tool has none or the call ended in a text-only answer (an unknown id, a parse failure); `text` then says why.
              oneOf:
                - $ref: '#/components/schemas/AveragePrices'
                - type: "null"
          required:
            - text
            - data
        attribution:
          type: array
          description: The upstreams behind the answer; attribution is a condition of several of their licences.
          items:
            $ref: '#/components/schemas/Source'
      required:
        - tool
        - version
        - result
        - attribution
    CapCard:
      type: object
      properties:
        capacity_gj:
          type: number
        stable:
          type: boolean
        summary:
          type: string
          description: Summary is "stable" or "lasts 442s", empty when there is nothing trustworthy to say (no capacitor data, or reps that run on charges).
        charge_fed:
          type: boolean
          description: ChargeFed is true when an ancillary rep runs on charges, not on the capacitor, which makes the capacitor figures meaningless.
      required:
        - capacity_gj
        - stable
        - summary
        - charge_fed
    CapStats:
      type: object
      properties:
        Capacity:
          type: number
        RechargeSec:
          type: number
        Stable:
          type: boolean
        StablePct:
          type: number
        SecondsToEmpty:
          type: number
      required:
        - Capacity
        - RechargeSec
        - Stable
        - StablePct
        - SecondsToEmpty
    ChainCost:
      type: object
      properties:
        prices_as_of:
          type: string
          description: PricesAsOf is the date (YYYY-MM-DD, UTC) of the ESI price list.
        materials_value:
          type:
            - number
            - "null"
          description: MaterialsValue is the value of the leaf materials at ESI average prices, in ISK; null without include_cost. Materials without an average price are left out (see Unpriced).
        unpriced:
          type: array
          description: Unpriced names the materials that have no average price; empty without include_cost.
          items:
            type: string
        system:
          type:
            - string
            - "null"
          description: System is the solar system whose cost index was read; null when none was asked for.
        cost_index:
          type:
            - number
            - "null"
          description: CostIndex is the manufacturing cost index used (the system's, or system_cost_index); null when none is known.
        cost_index_as_of:
          type:
            - string
            - "null"
          description: CostIndexAsOf is the date (YYYY-MM-DD, UTC) of ESI's cost index list; null for an explicit system_cost_index or when none was read.
        facility_tax_pct:
          type: number
          description: FacilityTaxPct is the facility tax in percent used for the fee (0.25 in an NPC station).
        jobs:
          type: integer
          description: Jobs is the number of manufacturing jobs the chain expands (each pays its own fee).
        estimated_item_value:
          type:
            - number
            - "null"
          description: EstimatedItemValue is the sum over every job of its ME 0 inputs at ESI adjusted prices, in ISK; null when no input has an adjusted price.
        job_fee:
          type:
            - number
            - "null"
          description: JobFee is EstimatedItemValue times (cost index + facility tax + 4% SCC surcharge), in ISK; null when no cost index is known.
        unpriced_inputs:
          type: array
          description: UnpricedInputs names the job inputs that have no adjusted price and so are left out of EstimatedItemValue.
          items:
            type: string
        total:
          type:
            - number
            - "null"
          description: Total is MaterialsValue plus JobFee in ISK; null when either is unknown or a material has no average price.
        product_average_price:
          type:
            - number
            - "null"
          description: ProductAveragePrice is ESI's average price of one unit of the product, in ISK; null without include_cost, and when ESI has none.
      required:
        - prices_as_of
        - materials_value
        - unpriced
        - system
        - cost_index
        - cost_index_as_of
        - facility_tax_pct
        - jobs
        - estimated_item_value
        - job_fee
        - unpriced_inputs
        - total
        - product_average_price
