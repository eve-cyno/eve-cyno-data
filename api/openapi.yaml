        - belts
        - ice_types
        - ly
    SystemSovereignty:
      type: object
      properties:
        system:
          type: string
          description: System is the system name as the SDE spells it.
        system_id:
          type: integer
          description: SystemID is the solar system ID.
        status:
          type: string
          description: Status is "alliance", "faction", "unclaimed", "wormhole" (no sovereignty in wormhole space) or "none" (ESI lists no entry for the system).
        alliance_id:
          type:
            - integer
            - "null"
          description: AllianceID is the holding alliance, null unless Status is "alliance".
        alliance:
          type:
            - string
            - "null"
          description: Alliance is the alliance name, null when there is no alliance or ESI gave no name.
        corporation_id:
          type:
            - integer
            - "null"
          description: CorporationID is the corporation that holds the claim for the alliance, null if none.
        corporation:
          type:
            - string
            - "null"
          description: Corporation is the corporation name, null when there is none or ESI gave no name.
        faction_id:
          type:
            - integer
            - "null"
          description: FactionID is the NPC faction holding the system, null unless Status is "faction".
        faction:
          type:
            - string
            - "null"
          description: Faction is the NPC faction name from the SDE, null when there is none.
      required:
        - system
        - system_id
        - status
        - alliance_id
        - alliance
        - corporation_id
        - corporation
        - faction_id
        - faction
    TankCard:
      type: object
