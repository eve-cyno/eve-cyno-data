      summary: 'Facts about up to 50 solar systems in one call: security, region, constellation, faction, wormhole class and effect…'
      description: |-
        Facts about up to 50 solar systems in one call: security, region, constellation, faction, wormhole class and effect, neighbouring systems (stargates), counts of asteroid belts, moons, planets by type and NPC stations, and the ice belt when EVE University lists one. One line per system.

        Sources: EVE Static Data Export (via Fuzzwork); EVE University Wiki (ice belt systems). `result.data` is a `SystemInfoList` object when the call succeeds.

        Access tier: **public**. No key needed.

