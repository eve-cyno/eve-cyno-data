# Dependabot: weekly updates for the Go module and the GitHub Actions, each ecosystem batched into
# one grouped PR per week (minor + patch for Go; every update type for Actions, whose "majors" are
# tag bumps reviewed together).
# Go itself: the FROM line in the Dockerfile is the only pin. The docker group moves it, and CI reads
# it through .github/actions/go, so the Dockerfile bump is the whole Go update.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"
